<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Debris Orbit Lab</title>
    <style>
        /* --- 1. 极简主义设计规范 --- */
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;500;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #080808; /* 深空黑 */
            color: #F4F4F0; /* 粉笔白 */
            font-family: 'Lexend', sans-serif;
        }

        /* UI 容器 */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            padding: 24px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 4px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 20px;
            display: block;
        }

        /* 状态指示器 */
        #status-box {
            margin-bottom: 20px;
            padding: 12px;
            border-left: 3px solid #00FF88;
            background: rgba(255, 255, 255, 0.05);
        }

        #status-title {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status-value {
            font-size: 1.1rem;
            font-weight: 500;
            color: #00FF88;
        }

        /* 滑块控制区 */
        .control-group {
            margin-bottom: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            color: #FF6B00; /* 橙色高亮 */
        }

        /* 自定义滑块样式 */
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #F4F4F0;
            margin-top: -6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            background: #FF6B00;
        }

        /* 底部署名 */
        .footer {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            color: #444;
            pointer-events: none;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-container">
        <h1>Orbit Laboratory</h1>
        <span class="subtitle">轨道动力学模拟终端</span>

        <div id="status-box">
            <div id="status-title">Mission Status</div>
            <div id="status-value">Stable Orbit</div>
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Altitude (高度)</span>
                <span id="val-h" class="value-display">400 km</span>
            </div>
            <input type="range" id="input-h" min="0" max="36000" value="2000" step="100">
        </div>

        <div class="control-group">
            <div class="label-row">
                <span>Velocity (速度)</span>
                <span id="val-v" class="value-display">7.0 km/s</span>
            </div>
            <input type="range" id="input-v" min="0" max="12" value="6.9" step="0.1">
        </div>

        <div style="font-size: 0.75rem; color: #555; line-height: 1.4;">
            * 调整速度以观察椭圆轨道变化。<br>
            * 速度过低将导致坠毁 (Crash)。<br>
            * 速度过高将逃逸 (Escape)。
        </div>
    </div>

    <div class="footer">VISUALIZATION LAB // PROTOTYPE</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- 物理常数 ---
        const R_EARTH = 63.71; // 缩放比例: 1单位 = 100km (为了3D显示方便，把6371km缩小100倍)
        const GM = 398600; // 实际引力参数 (km^3/s^2) - 计算用实际值，绘图用缩放值

        // --- 场景初始化 ---
        const scene = new THREE.Scene();
        // 稍微带点雾气，增加深空感
        scene.fog = new THREE.FogExp2(0x080808, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 150, 150); // 俯视视角

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 创建极简地球 (线框风格) ---
        // 1. 黑色遮挡球
        const earthGeo = new THREE.SphereGeometry(R_EARTH, 32, 32);
        const earthMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earth);

        // 2. 纬线经线网格 (代替贴图，保证单文件可运行)
        const wireGeo = new THREE.WireframeGeometry(earthGeo);
        const wireMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
        const earthWire = new THREE.LineSegments(wireGeo, wireMat);
        scene.add(earthWire);

        // 3. 大气光晕 (简单的发光圆环)
        const atmosGeo = new THREE.RingGeometry(R_EARTH, R_EARTH + 2, 64);
        const atmosMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
        const atmos = new THREE.Mesh(atmosGeo, atmosMat);
        atmos.rotation.x = Math.PI / 2; // 放平
        // scene.add(atmos); // 可选，为了极简先不加

        // --- 轨道可视化对象 ---
        let orbitLine; // 轨道线
        let satellite; // 卫星点

        // 初始化轨道线
        function initOrbitVisuals() {
            // 轨道线材质
            const material = new THREE.LineBasicMaterial({ color: 0x00FF88, linewidth: 2 });
            const geometry = new THREE.BufferGeometry();
            orbitLine = new THREE.Line(geometry, material);
            orbitLine.rotation.x = Math.PI / 2; // 旋转到水平面
            scene.add(orbitLine);

            // 卫星小球
            const satGeo = new THREE.SphereGeometry(1.5, 16, 16);
            const satMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
            satellite = new THREE.Mesh(satGeo, satMat);
            scene.add(satellite);
        }
        initOrbitVisuals();

        // --- 核心算法：计算轨道 ---
        function updateOrbit() {
            // 1. 获取输入值
            const h = parseFloat(document.getElementById('input-h').value); // 高度 km
            const v = parseFloat(document.getElementById('input-v').value); // 速度 km/s

            // 更新UI文字
            document.getElementById('val-h').innerText = h + " km";
            document.getElementById('val-v').innerText = v.toFixed(2) + " km/s";

            // 2. 物理计算 (单位：km)
            const r = 6371 + h; // 当前地心距离
            
            // 活力公式计算半长轴 a: 1/a = 2/r - v^2/GM
            const invA = (2 / r) - (Math.pow(v, 2) / GM);
            const a = 1 / invA;

            const uiBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-value');
            const orbitMat = orbitLine.material;

            // --- 情况 A: 逃逸 (双曲线/抛物线) ---
            if (invA <= 0) {
                statusText.innerText = "ESCAPE TRAJECTORY";
                statusText.style.color = "#F4F4F0";
                uiBox.style.borderLeftColor = "#F4F4F0";
                orbitMat.color.setHex(0xFFFFFF); // 白色
                
                // 画一条直线代表飞走了
                const points = [];
                // 简单的直线模拟逃逸
                const scale = 0.01; // 缩放回3D场景单位
                points.push(new THREE.Vector3(r * scale, 0, 0));
                points.push(new THREE.Vector3(r * scale + 100, 100, 0)); // 假装飞向远方
                orbitLine.geometry.setFromPoints(points);
                
                // 卫星位置
                satellite.position.set(r * scale, 0, 0);
                return;
            }

            // --- 情况 B: 闭合轨道 (椭圆) ---
            
            // 计算对角点距离 r2
            // 椭圆原理: r + r2 = 2a  => r2 = 2a - r
            const r2 = (2 * a) - r;

            // 确定近地点(rp)和远地点(ra)
            // 如果 v > 圆周速度，当前是近地点(rp = r)
            // 如果 v < 圆周速度，当前是远地点(ra = r)
            const rp = Math.min(r, r2);
            const ra = Math.max(r, r2);

            // 3D场景缩放 (1单位 = 100km)
            const scale = 0.01; 
            const a_scaled = a * scale;
            const rp_scaled = rp * scale;
            const ra_scaled = ra * scale;

            // 计算偏心率 e
            // ra = a(1+e) => e = ra/a - 1
            const e = (ra - rp) / (ra + rp);

            // 计算半短轴 b
            const b_scaled = a_scaled * Math.sqrt(1 - e * e);

            // 计算椭圆中心偏移量 c
            // 椭圆中心在 (0,0)，地球在焦点。焦点距离中心 c = a * e
            const c_scaled = a_scaled * e;

            // 确定偏移方向
            // 如果 v > 圆周速度(GM/r开根号)，当前是近地点，地球在左侧焦点，轨道向右延伸
            // Center X = r - a
            const centerX = (r * scale) - a_scaled;

            // 3. 状态判定与颜色反馈
            if (rp < 6471) { // 近地点进入大气层 (6371 + 100km)
                statusText.innerText = "CRASH WARNING";
                statusText.style.color = "#FF3300"; // 红色
                uiBox.style.borderLeftColor = "#FF3300";
                orbitMat.color.setHex(0xFF3300);
            } else {
                // 检查偏心率，接近0为圆
                if (e < 0.01) {
                    statusText.innerText = "STABLE CIRCULAR";
                    statusText.style.color = "#00FF88"; // 绿色
                    uiBox.style.borderLeftColor = "#00FF88";
                    orbitMat.color.setHex(0x00FF88);
                } else {
                    statusText.innerText = "ELLIPTICAL ORBIT";
                    statusText.style.color = "#FF6B00"; // 橙色
                    uiBox.style.borderLeftColor = "#FF6B00";
                    orbitMat.color.setHex(0xFF6B00);
                }
            }

            // 4. 绘制椭圆
            const curve = new THREE.EllipseCurve(
                centerX, 0,            // ax, aY (中心坐标)
                a_scaled, b_scaled,    // xRadius, yRadius
                0, 2 * Math.PI,        // startAngle, endAngle
                false,                 // clockwise
                0                      // rotation
            );

            const points = curve.getPoints(100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            orbitLine.geometry.dispose();
            orbitLine.geometry = geometry;

            // 更新卫星位置 (放在发射点)
            satellite.position.set(r * scale, 0, 0);
        }

        // 监听滑块
        document.getElementById('input-h').addEventListener('input', updateOrbit);
        document.getElementById('input-v').addEventListener('input', updateOrbit);

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            // 让地球线框慢慢转动，增加科技感
            earthWire.rotation.y += 0.0005; 
            renderer.render(scene, camera);
        }

        // 启动
        updateOrbit(); // 初始计算一次
        animate();

    </script>
</body>
</html>
