<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Kessler Syndrome: Clean Earth</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* 左上角仪表盘 */
        #dashboard {
            position: absolute; top: 20px; left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.9);
            padding: 15px 20px;
            border: 2px solid #0055aa; 
            font-family: 'Courier New', monospace;
            min-width: 180px;
            box-shadow: 0 0 25px rgba(0, 85, 170, 0.3);
            backdrop-filter: blur(5px);
        }
        .stat-item { margin-bottom: 2px; font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
        .big-num { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        .zone-indicator { font-size: 18px; font-weight: bold; color: #00ffff; margin-top: 5px; text-shadow: 0 0 5px #00ffff; }
        .sub-zone { font-size: 12px; color: #aaaaaa; margin-top: 2px; font-style: italic; }
        
        /* 燃料条 */
        .fuel-bar-container { width: 100%; height: 6px; background: #333; margin-top: 5px; border-radius: 3px; overflow: hidden; }
        .fuel-bar-fill { height: 100%; background: #ffcc00; width: 100%; transition: width 0.2s linear; }
        .fuel-hint { font-size: 10px; color: #666; margin-top: 4px; display: flex; justify-content: space-between;}

        /* 右上角设置 */
        #sat-settings {
            position: absolute; top: 20px; right: 20px;
            pointer-events: auto;
            background: rgba(0,0,0,0.8);
            border: 1px solid #444;
            padding: 10px;
            color: #ccc;
            font-size: 12px;
        }
        input[type="color"] { border: none; width: 30px; height: 20px; cursor: pointer; background: none; vertical-align: middle; }

        /* 底部控制台 */
        #controls-wrapper {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; pointer-events: auto;
        }
        #controls {
            background: rgba(5,5,5,0.95);
            border: 2px solid #0055aa;
            padding: 15px 30px;
            display: flex; gap: 40px;
            border-radius: 8px;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .control-group { display: flex; flex-direction: column; align-items: center; }
        .control-label { display: block; font-size: 11px; color: #aaa; margin-bottom: 8px; font-weight: bold; letter-spacing: 2px; text-align: center;}
        
        /* 轨道定点按钮 */
        .orbit-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 240px;
        }
        .orbit-btn {
            background: rgba(0, 85, 170, 0.1);
            border: 1px solid #0055aa;
            color: #00aaff;
            padding: 6px 2px;
            font-size: 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        .orbit-btn:hover { background: #0055aa; color: white; box-shadow: 0 0 10px #00aaff; }
        .orbit-btn.active { background: #00aaff; color: black; border-color: white; box-shadow: 0 0 15px #00aaff; }
        .btn-subtext { display: block; font-size: 9px; opacity: 0.7; transform: scale(0.9); }

        /* 倾角按钮 */
        .btn-inc {
            background: #050505; border: 1px solid #0055aa; color: #00aaff;
            width: 36px; height: 36px; cursor: pointer; font-weight: bold; font-family: monospace; font-size: 18px;
            transition: all 0.2s; border-radius: 4px;
        }
        .btn-inc:hover { background: #00aaff; color: #000; box-shadow: 0 0 15px #00aaff; }
        .btn-inc:active { transform: scale(0.95); }
        .inc-display { display: inline-block; width: 60px; text-align: center; font-family: monospace; color: #00ffff; font-size: 18px; font-weight: bold; }

        .val-display { color: #00ffff; font-size: 12px; margin-top: 5px; display: block; font-family: monospace; text-align: center; }
        input[type=range] { width: 120px; cursor: pointer; accent-color: #0055aa; height: 4px; }

        /* 警告 & 结束 */
        #alert {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            color: #ff0000; background: #000; border: 2px solid #ff0000;
            padding: 15px 50px; font-weight: bold; font-size: 24px; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }
        #game-over {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
        }
        button.retry-btn {
            background: #000; border: 2px solid #0055aa; color: #00aaff;
            padding: 15px 50px; font-size: 18px; cursor: pointer; margin-top: 30px;
            font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s;
        }
        button.retry-btn:hover { background: #0055aa; color: #fff; box-shadow: 0 0 20px #0055aa; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="dashboard">
            <div class="stat-item">Mission Time</div>
            <div class="big-num"><span id="month-display">0.0</span> / 36</div>
            
            <div class="stat-item">Hull Integrity</div>
            <div class="big-num" id="integrity" style="color:#00ff00">200</div>

            <div class="stat-item">Fuel Reserves</div>
            <div class="big-num" id="fuel-display" style="color:#ffcc00; margin-bottom:0;">100.0%</div>
            <div class="fuel-bar-container"><div id="fuel-bar" class="fuel-bar-fill"></div></div>
            <div class="fuel-hint">
                <span>Usage:</span>
                <span id="fuel-rate">High</span>
            </div>
            
            <div style="margin-top:15px; border-top:1px solid #555; padding-top:10px;">
                <div class="stat-item">Current Zone</div>
                <div class="zone-indicator" id="zone-display">LEO</div>
                <div class="sub-zone" id="sub-zone-display">Starlink Band</div>
            </div>
        </div>

        <div id="sat-settings">
            SAT COLOR <input type="color" id="colorPicker" value="#00ffff">
        </div>

        <div id="alert">IMPACT DETECTED</div>

        <div id="controls-wrapper">
            <div id="controls">
                <!-- 轨道定点按钮 -->
                <div class="control-group">
                    <span class="control-label">TARGET ORBIT</span>
                    <div class="orbit-grid">
                        <button class="orbit-btn active" onclick="setOrbit(550, this)">LEO<span class="btn-subtext">550 km</span></button>
                        <button class="orbit-btn" onclick="setOrbit(780, this)">LEO<span class="btn-subtext">780 km</span></button>
                        <button class="orbit-btn" onclick="setOrbit(1200, this)">LEO<span class="btn-subtext">1200 km</span></button>
                        <button class="orbit-btn" onclick="setOrbit(20200, this)">GPS<span class="btn-subtext">20k km</span></button>
                        <button class="orbit-btn" onclick="setOrbit(23222, this)">GALILEO<span class="btn-subtext">23k km</span></button>
                        <button class="orbit-btn" onclick="setOrbit(35786, this)">GEO<span class="btn-subtext">36k km</span></button>
                    </div>
                    <span class="val-display" id="altVal">TARGET: 550 KM</span>
                </div>

                <!-- 倾角按钮控制 -->
                <div class="control-group">
                    <span class="control-label">INCLINATION</span>
                    <div style="display:flex; align-items:center; justify-content:center; gap:15px;">
                        <button class="btn-inc" onclick="adjustInc(-5)">-</button>
                        <span id="incVal" class="inc-display">20°</span>
                        <button class="btn-inc" onclick="adjustInc(5)">+</button>
                    </div>
                </div>

                <!-- 速度滑块 -->
                <div class="control-group">
                    <span class="control-label">SPEED</span>
                    <input type="range" id="speedRange" min="1" max="20" step="1" value="1">
                    <span class="val-display" id="speedVal">x1</span>
                </div>
            </div>
        </div>

        <div id="game-over">
            <h1 id="end-status" style="color:white; font-size:40px; margin:0; text-transform: uppercase; letter-spacing: 5px;">Mission Failed</h1>
            <p id="end-reason" style="color:#aaa; font-size:16px; margin-top:10px;">Reason Unknown</p>
            <button class="retry-btn" onclick="location.reload()">Re-Initialize</button>
        </div>
    </div>

    <script>
        // --- 核心配置 ---
        const CONFIG = {
            earthR: 6371, 
            scale: 0.001,
            debrisCount: 20000, 
            collisionProb: 0.002, 
            monthsToWin: 36,
            secondsPerMonth: 50,
            startArmor: 200
        };
        const R = CONFIG.earthR * CONFIG.scale; 

        let state = {
            active: true,
            totalTime: 0,
            currentMonth: 0,
            armor: CONFIG.startArmor,
            fuel: 100,
            timeScale: 1.0,
            targetAlt: 550, 
            targetInc: 20 * Math.PI / 180,
            currentIncDeg: 20,
            satAngle: 0
        };

        // --- 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(30, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); 
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 12;
        controls.maxDistance = 200;

        // --- 1. 地球: 纯净白陆蓝海 (移除杂乱线框) ---
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // A. 底层：白色球体 (陆地)
        const baseSphere = new THREE.Mesh(
            new THREE.SphereGeometry(R - 0.01, 128, 128), 
            new THREE.MeshBasicMaterial({ color: 0xffffff }) // White Land
        );
        earthGroup.add(baseSphere);

        // B. 顶层：蓝色球体 (海洋) + 遮罩
        const texLoader = new THREE.TextureLoader();
        const earthMap = texLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');
        earthMap.anisotropy = renderer.capabilities.getMaxAnisotropy();

        const oceanMesh = new THREE.Mesh(
            new THREE.SphereGeometry(R, 128, 128),
            new THREE.MeshBasicMaterial({ 
                color: 0x004488,       // Blue Ocean
                alphaMap: earthMap,    
                transparent: true,     
                side: THREE.DoubleSide
                // 移除 alphaTest，让边缘更柔和，或者根据需要调整
            })
        );
        earthGroup.add(oceanMesh);

        // [删除] 移除了 WireframeGeometry (那层黑色的杂线)

        // C. 大气
        const outlineMesh = new THREE.Mesh(
            new THREE.SphereGeometry(R + 0.15, 64, 64),
            new THREE.MeshBasicMaterial({ 
                color: 0x0055aa,
                side: THREE.BackSide, 
                transparent: true, 
                opacity: 0.2,
                blending: THREE.AdditiveBlending
            })
        );
        earthGroup.add(outlineMesh);

        // --- 2. 卫星 & 轨迹 ---
        const satWrapper = new THREE.Group(); 
        scene.add(satWrapper);

        const orbitCurve = new THREE.EllipseCurve(0, 0, 1, 1, 0, 2 * Math.PI, false, 0);
        const orbitPoints = orbitCurve.getPoints(200);
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
        const orbitLine = new THREE.LineLoop(orbitGeo, orbitMat);
        orbitLine.rotation.x = Math.PI / 2;
        satWrapper.add(orbitLine);

        const satMesh = new THREE.Group(); 
        const satCore = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
        satMesh.add(satCore);
        const pGeo = new THREE.BoxGeometry(0.02, 0.3, 0.5);
        const pMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
        const pL = new THREE.Mesh(pGeo, pMat); pL.position.set(0, 0, 0.5); satMesh.add(pL);
        const pR = pL.clone(); pR.position.set(0, 0, -0.5); satMesh.add(pR);
        satWrapper.add(satMesh);

        // --- 3. 混沌垃圾云 ---
        const debrisGeo = new THREE.BoxGeometry(1, 1, 1);
        const debrisMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); 
        const debrisMesh = new THREE.InstancedMesh(debrisGeo, debrisMat, CONFIG.debrisCount);
        scene.add(debrisMesh);

        const debrisData = [];
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        const rogueOrbits = [];
        for(let k=0; k<50; k++) {
            rogueOrbits.push({
                inc: Math.random() * Math.PI, 
                raan: Math.random() * Math.PI * 2,
                alt: 500 + Math.random() * 30000, 
                color: Math.random() > 0.5 ? 0xffffff : (Math.random()>0.5 ? 0x00ffff : 0xffaa00) 
            });
        }

        for(let i=0; i<CONFIG.debrisCount; i++) {
            let alt, inc, raan;
            let zoneColor = 0xffffff;
            let size = 0.02;

            const r = Math.random();
            
            if (r < 0.20) {
                const orb = rogueOrbits[Math.floor(Math.random() * rogueOrbits.length)];
                alt = orb.alt + (Math.random()-0.5) * 50; 
                inc = orb.inc;
                raan = orb.raan;
                zoneColor = orb.color;
                size = 0.025; 
            } 
            else if (r < 0.40) { 
                alt = 300 + Math.random() * 1800; 
                zoneColor = 0x00ffcc;
                inc = Math.acos(2 * Math.random() - 1); 
                raan = Math.random() * Math.PI * 2;
                size = 0.015;
            } 
            else if (r < 0.55) { 
                alt = 18000 + (Math.random()-0.5) * 8000; 
                zoneColor = 0xddddff; 
                inc = (55 + (Math.random()-0.5) * 60) * (Math.PI / 180);
                raan = Math.random() * Math.PI * 2; 
            } 
            else if (r < 0.65) { 
                alt = 35786 + (Math.random()-0.5) * 2000; 
                zoneColor = 0xffffff;
                inc = (Math.random() - 0.5) * 0.5; 
                raan = Math.random() * Math.PI * 2;
                size = 0.04; 
            } 
            else { 
                alt = 2000 + Math.pow(Math.random(), 1.5) * 35000; 
                zoneColor = 0xcccccc; 
                inc = Math.acos(2 * Math.random() - 1); 
                raan = Math.random() * Math.PI * 2;
                size = 0.02;
            }

            const radius = (CONFIG.earthR + alt) * CONFIG.scale;
            const theta = Math.random() * Math.PI * 2; 

            debrisData.push({
                radius: radius, theta: theta, raan: raan, inc: inc,
                speed: (0.6 * Math.sqrt(R/radius)) * (Math.random()>0.5?1:-1),
                size: size, rotSpeed: Math.random() * 3
            });
            
            dummy.scale.set(size, size, size);
            debrisMesh.setMatrixAt(i, dummy.matrix);
            
            color.setHex(zoneColor);
            debrisMesh.setColorAt(i, color);
        }
        
        debrisMesh.instanceMatrix.needsUpdate = true;
        if(debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;

        // --- Logic ---
        const clock = new THREE.Clock();

        function update() {
            if(!state.active) return;

            const dt = clock.getDelta();
            const logicDt = dt * state.timeScale; 

            state.totalTime += logicDt;
            state.currentMonth = state.totalTime / CONFIG.secondsPerMonth;
            document.getElementById('month-display').innerText = state.currentMonth.toFixed(1);
            if(state.currentMonth >= CONFIG.monthsToWin) endGame(true);

            // Fuel
            const altRatio = state.targetAlt / 36000;
            const baseRate = 0.05; 
            const savings = altRatio * 0.045; 
            const currentRate = Math.max(0.005, baseRate - savings); 
            
            state.fuel -= currentRate * logicDt;
            
            const fuelEl = document.getElementById('fuel-display');
            const fuelBar = document.getElementById('fuel-bar');
            const rateEl = document.getElementById('fuel-rate');
            
            fuelEl.innerText = state.fuel.toFixed(1) + "%";
            fuelBar.style.width = state.fuel + "%";
            
            if(currentRate > 0.04) rateEl.innerText = "Burn: HIGH";
            else if(currentRate > 0.02) rateEl.innerText = "Burn: MED";
            else rateEl.innerText = "Burn: MINIMAL";

            if(state.fuel < 20) { fuelEl.style.color = "#ff3333"; fuelBar.style.backgroundColor = "#ff3333"; }
            else { fuelEl.style.color = "#ffcc00"; fuelBar.style.backgroundColor = "#ffcc00"; }
            if(state.fuel <= 0) { state.fuel = 0; endGame(false, "Fuel Depleted. Orbit Decayed."); }

            // Satellite
            const targetR = (CONFIG.earthR + state.targetAlt) * CONFIG.scale;
            const currentR = satMesh.position.length() || targetR;
            const newR = currentR + (targetR - currentR) * 0.1;
            
            satWrapper.rotation.z += (state.targetInc - satWrapper.rotation.z) * 0.1;
            orbitLine.scale.set(newR, newR, 1);

            const satSpeed = 0.8 * Math.sqrt(R/newR) * (1 + state.timeScale * 0.05);
            state.satAngle -= satSpeed * dt;
            satMesh.position.set(Math.cos(state.satAngle)*newR, 0, Math.sin(state.satAngle)*newR);
            satMesh.lookAt(0,0,0); satMesh.rotateY(Math.PI/2); 

            // Debris
            const satWorldPos = new THREE.Vector3();
            satMesh.getWorldPosition(satWorldPos);
            let hit = false;

            for(let i=0; i<CONFIG.debrisCount; i++) {
                const d = debrisData[i];
                d.theta += d.speed * dt * (1 + state.timeScale * 0.05);

                const cT = Math.cos(d.theta), sT = Math.sin(d.theta);
                const cI = Math.cos(d.inc), sI = Math.sin(d.inc);
                const cR = Math.cos(d.raan), sR = Math.sin(d.raan);
                const x = d.radius * (cR * cT - sR * sT * cI);
                const z = d.radius * (sR * cT + cR * sT * cI);
                const y = d.radius * (sT * sI);

                dummy.position.set(x, y, z);
                dummy.rotation.x += d.rotSpeed * dt; 
                dummy.scale.setScalar(d.size);
                dummy.updateMatrix();
                debrisMesh.setMatrixAt(i, dummy.matrix);

                if(Math.abs(d.radius - newR) < 0.8) {
                    const distSq = (x-satWorldPos.x)**2 + (y-satWorldPos.y)**2 + (z-satWorldPos.z)**2;
                    if(distSq < 0.4 && Math.random() < CONFIG.collisionProb) { hit = true; d.theta += 0.5; }
                }
            }
            debrisMesh.instanceMatrix.needsUpdate = true;

            if(hit) {
                state.armor -= 1; 
                const el = document.getElementById('integrity');
                el.innerText = state.armor; 
                el.style.color = 'red';
                document.getElementById('alert').style.opacity = 1;
                setTimeout(() => {
                    if(state.armor > 50) el.style.color = '#00ff00';
                    document.getElementById('alert').style.opacity = 0;
                }, 500);
                if(state.armor <= 0) endGame(false, "Critical Hull Failure.");
            }

            // Zone UI
            const zDiv = document.getElementById('zone-display');
            const subDiv = document.getElementById('sub-zone-display');
            const alt = state.targetAlt;
            
            if(alt < 2000) { 
                zDiv.innerText = "LEO"; zDiv.style.color = "#ff4444"; 
                if(alt < 600) subDiv.innerText = "Starlink Shell";
                else if(alt < 900) subDiv.innerText = "Iridium Debris";
                else subDiv.innerText = "Upper LEO";
            }
            else if(alt > 35500 && alt < 36000) { 
                zDiv.innerText = "GEO"; zDiv.style.color = "#00ffff"; 
                subDiv.innerText = "Stationary Ring";
            }
            else if(alt >= 36000) {
                zDiv.innerText = "GRAVEYARD"; zDiv.style.color = "#888888"; 
                subDiv.innerText = "Dead Satellites";
            }
            else { 
                zDiv.innerText = "MEO"; zDiv.style.color = "#ffff00"; 
                if(alt > 19000 && alt < 24000) subDiv.innerText = "GPS/Galileo";
                else subDiv.innerText = "Transfer Orbit";
            }
        }

        function endGame(win, reason) {
            state.active = false;
            const scr = document.getElementById('game-over');
            const h1 = document.getElementById('end-status');
            const p = document.getElementById('end-reason');
            scr.style.display = 'flex';
            h1.innerText = win ? "MISSION SUCCESS" : "MISSION FAILED";
            h1.style.color = win ? "#00ff00" : "#ff0000";
            p.innerText = win ? "Orbit Duration Completed." : reason;
        }

        // --- 交互 ---
        window.setOrbit = function(km, btn) {
            state.targetAlt = km;
            document.getElementById('altVal').innerText = "TARGET: " + km + " KM";
            document.querySelectorAll('.orbit-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        };
        
        window.adjustInc = function(delta) {
            if(!state.active) return;
            let newInc = state.currentIncDeg + delta;
            if(newInc < 0) newInc = 0; if(newInc > 90) newInc = 90;
            state.currentIncDeg = newInc;
            state.targetInc = newInc * (Math.PI / 180);
            document.getElementById('incVal').innerText = newInc + "°";
        };

        document.getElementById('speedRange').addEventListener('input', e => {
            state.timeScale = parseFloat(e.target.value);
            document.getElementById('speedVal').innerText = "x" + state.timeScale;
        });
        document.getElementById('colorPicker').addEventListener('input', e => {
            satCore.material.color.set(e.target.value);
            orbitLine.material.color.set(e.target.value);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            update();
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
